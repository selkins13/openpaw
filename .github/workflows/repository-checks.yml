name: Repository checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check repository and documentation
        run: python3 .github/scripts/check_repository.py
