[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openpaw-hub"
version = "0.1.0.dev0"
description = "Experimental OpenPaw v0.1 local hub prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["pygame>=2.6,<3"]

[project.scripts]
openpaw-hub = "openpaw_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]
